server.port=${PORT:8091}

# MySQL: tự tạo database `dragonball` nếu chưa có (cần user có quyền CREATE).
# Đổi bằng biến môi trường DB_URL / DB_USER / DB_PASS (mặc định root, mật khẩu rỗng).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dragonball?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:}

# Tạo bảng (CREATE TABLE IF NOT EXISTS) khi khởi động
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Trình duyệt gọi từ web dev (Vite :5173) hoặc GitHub Pages: danh sách origin cho phép, cách nhau bằng dấu phẩy
game.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

# Một ván lưu vài trăm KB JSON
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-request-size=10MB
