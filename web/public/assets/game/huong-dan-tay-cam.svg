<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213a"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="than" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5266"/><stop offset="1" stop-color="#2a3041"/></linearGradient>
    <style>
      .t { fill: #fff; font-weight: 700; font-size: 22px; }
      .m { fill: #b9c4dc; font-size: 16px; }
      .k { fill: #ffd166; font-weight: 800; font-size: 22px; }
      .ln { stroke: #ffd166; stroke-width: 2; fill: none; }
      .dot { fill: #ffd166; }
      .btn { fill: #1b2030; stroke: #8a93aa; stroke-width: 2; }
      .hl { stroke: #ffd166; stroke-width: 3; }
      .tt { fill: #fff; font-weight: 800; font-size: 19px; }
      .ts { fill: #c8d1e6; font-size: 14.5px; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#nen)"/>
  <text x="600" y="44" text-anchor="middle" class="t" style="font-size:30px">🎮 Hướng dẫn chơi bằng tay cầm (kiểu PS)</text>

  <!-- Thân tay cầm -->
  <path d="M440 190 H760 Q830 190 850 270 L880 380 Q895 450 840 450 Q800 450 780 405 L765 380 H435 L420 405 Q400 450 360 450 Q305 450 320 380 L350 270 Q370 190 440 190 Z" fill="url(#than)" stroke="#8a93aa" stroke-width="3"/>
  <!-- Vai: L2 R2 L1 R1 -->
  <rect x="430" y="132" width="100" height="40" rx="14" class="btn hl"/>
  <rect x="670" y="132" width="100" height="40" rx="14" class="btn hl"/>
  <rect x="420" y="178" width="120" height="22" rx="10" class="btn hl"/>
  <rect x="660" y="178" width="120" height="22" rx="10" class="btn hl"/>
  <text x="480" y="159" text-anchor="middle" class="tt">L2</text>
  <text x="720" y="159" text-anchor="middle" class="tt">R2</text>
  <text x="480" y="195" text-anchor="middle" class="ts" style="font-weight:700">L1</text>
  <text x="720" y="195" text-anchor="middle" class="ts" style="font-weight:700">R1</text>
  <!-- Touchpad, Share, Options -->
  <rect x="555" y="215" width="90" height="56" rx="10" class="btn"/>
  <rect x="520" y="222" width="12" height="20" rx="5" class="btn"/>
  <rect x="668" y="222" width="12" height="20" rx="5" class="btn"/>
  <text x="526" y="216" text-anchor="middle" class="ts" style="font-size:11px">Share</text>
  <text x="664" y="216" text-anchor="middle" class="ts" style="font-size:11px">Options</text>
  <!-- Chữ thập -->
  <path d="M458 240 h24 v18 h18 v24 h-18 v18 h-24 v-18 h-18 v-24 h18 z" class="btn hl" transform="translate(-6 -2)"/>
  <!-- Nút ✕ ○ □ △ -->
  <circle cx="730" cy="226" r="17" class="btn"/><text x="730" y="233" text-anchor="middle" fill="#6fe0c5" font-size="20" font-weight="800">△</text>
  <circle cx="700" cy="256" r="17" class="btn hl"/><text x="700" y="263" text-anchor="middle" fill="#f48fb1" font-size="20" font-weight="800">□</text>
  <circle cx="760" cy="256" r="17" class="btn hl"/><text x="760" y="263" text-anchor="middle" fill="#ff6b6b" font-size="20" font-weight="800">○</text>
  <circle cx="730" cy="286" r="17" class="btn hl"/><text x="730" y="294" text-anchor="middle" fill="#7aa7ff" font-size="22" font-weight="800">✕</text>
  <!-- Cần analog -->
  <circle cx="530" cy="332" r="32" class="btn hl"/><circle cx="530" cy="332" r="18" fill="#2b3145" stroke="#8a93aa" stroke-width="2"/>
  <circle cx="670" cy="332" r="32" class="btn hl"/><circle cx="670" cy="332" r="18" fill="#2b3145" stroke="#8a93aa" stroke-width="2"/>

  <!-- Chú thích bên trái -->
  <path class="ln" d="M430 152 H330"/><circle class="dot" cx="430" cy="152" r="4"/>
  <text x="320" y="146" text-anchor="end" class="k">L2</text><text x="320" y="168" text-anchor="end" class="m">Bay (tốn mana)</text>

  <path class="ln" d="M420 189 H330 V215 H280"/><circle class="dot" cx="420" cy="189" r="4"/>
  <text x="270" y="209" text-anchor="end" class="k">L1</text><text x="270" y="231" text-anchor="end" class="m">Chiêu trước</text>

  <path class="ln" d="M454 262 H300"/><circle class="dot" cx="454" cy="262" r="4"/>
  <text x="290" y="266" text-anchor="end" class="k">Chữ thập</text><text x="290" y="288" text-anchor="end" class="m">Chạy (thay cần trái)</text>

  <path class="ln" d="M500 345 H300"/><circle class="dot" cx="500" cy="345" r="4"/>
  <text x="290" y="342" text-anchor="end" class="k">Cần trái</text><text x="290" y="364" text-anchor="end" class="m">Chạy · muốn bay thì bấm ○</text>

  <!-- Chú thích bên phải -->
  <path class="ln" d="M770 152 H870"/><circle class="dot" cx="770" cy="152" r="4"/>
  <text x="880" y="146" class="k">R2</text><text x="880" y="168" class="m">Ra đòn (giữ = đánh liên tục)</text>

  <path class="ln" d="M780 189 H870 V215 H920"/><circle class="dot" cx="780" cy="189" r="4"/>
  <text x="930" y="209" class="k">R1</text><text x="930" y="231" class="m">Chiêu sau</text>

  <path class="ln" d="M777 256 H870"/><circle class="dot" cx="777" cy="256" r="4"/>
  <text x="880" y="262" class="k">○</text><text x="915" y="262" class="m">Bay tới hướng cần trái</text>

  <path class="ln" d="M747 292 H870"/><circle class="dot" cx="747" cy="292" r="4"/>
  <text x="880" y="298" class="k">✕ / □</text><text x="948" y="298" class="m">Ra đòn (giữ)</text>

  <path class="ln" d="M700 345 H870"/><circle class="dot" cx="700" cy="345" r="4"/>
  <text x="880" y="342" class="k">Cần phải</text><text x="880" y="364" class="m">Ngắm · không gạt = tự ngắm gà gần nhất</text>

  <text x="600" y="412" text-anchor="middle" class="m" style="font-size:15px">Options: bắt đầu / tạm dừng · Share: đổi nhân vật (khi chỉ có 1 tay cầm) · Tay cầm rung khi bị đánh</text>

  <!-- Bảng chiêu -->
  <rect x="30" y="440" width="1140" height="300" rx="18" fill="#10172b" stroke="#2f3a5a" stroke-width="2"/>
  <text x="600" y="476" text-anchor="middle" class="t" style="font-size:22px"><tspan fill="#ffd166">L1</tspan> ◀  đổi chiêu  ▶ <tspan fill="#ffd166">R1</tspan>   rồi giữ <tspan fill="#7aa7ff">✕</tspan> / <tspan fill="#7aa7ff">R2</tspan> để ra chiêu đang chọn</text>

  <g transform="translate(50 500)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#ff9f6b" stroke-width="3"/>
    <text x="130" y="38" text-anchor="middle" class="tt" fill="#ff9f6b" style="fill:#ff9f6b;font-size:24px">① ĐẤM</text>
    <text x="130" y="72" text-anchor="middle" class="ts">Nhanh, đánh gần</text>
    <text x="130" y="100" text-anchor="middle" class="ts">Sát thương 50 (cả 2 nhân vật)</text>
    <text x="130" y="128" text-anchor="middle" class="ts">Hồi chiêu 0,4 giây</text>
    <text x="130" y="170" text-anchor="middle" class="ts" style="fill:#8fa0c8">Chiêu mặc định,</text>
    <text x="130" y="190" text-anchor="middle" class="ts" style="fill:#8fa0c8">không tốn mana</text>
  </g>
  <g transform="translate(330 500)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#7ad7ff" stroke-width="3"/>
    <text x="130" y="38" text-anchor="middle" class="tt" style="fill:#7ad7ff;font-size:24px">② CHIÊU ĐẶC BIỆT</text>
    <text x="130" y="72" text-anchor="middle" class="ts">Bắn chưởng ra xa</text>
    <text x="130" y="100" text-anchor="middle" class="ts">Mabu 100 · Zinbu 150</text>
    <text x="130" y="128" text-anchor="middle" class="ts">Hồi chiêu 1,6 giây</text>
    <text x="130" y="170" text-anchor="middle" class="ts" style="fill:#8fa0c8">Chưởng đi qua cây</text>
    <text x="130" y="190" text-anchor="middle" class="ts" style="fill:#8fa0c8">thì cây đổ, rơi táo</text>
  </g>
  <g transform="translate(610 500)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#b6f08a" stroke-width="3"/>
    <text x="130" y="38" text-anchor="middle" class="tt" style="fill:#b6f08a;font-size:24px">③ ĐÁ</text>
    <text x="130" y="72" text-anchor="middle" class="ts">Đòn mạnh hơn đấm</text>
    <text x="130" y="100" text-anchor="middle" class="ts">Mabu 70 · Zinbu 100</text>
    <text x="130" y="128" text-anchor="middle" class="ts">Hồi chiêu 0,64 giây</text>
    <text x="130" y="170" text-anchor="middle" class="ts" style="fill:#8fa0c8">Không tốn mana</text>
  </g>
  <g transform="translate(890 500)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#f48fb1" stroke-width="3"/>
    <text x="130" y="34" text-anchor="middle" class="tt" style="fill:#f48fb1;font-size:22px">④ CHIÊU RIÊNG</text>
    <text x="14" y="68" class="tt" style="fill:#ec4899;font-size:17px">☁ Mabu: Biến mây</text>
    <text x="14" y="90" class="ts">Hoá mây 7 giây, quét gà 250,</text>
    <text x="14" y="108" class="ts">không nhận sát thương · hồi 40s</text>
    <text x="14" y="146" class="tt" style="fill:#facc15;font-size:17px">🍫 Zinbu: Biến socola</text>
    <text x="14" y="168" class="ts">Chưởng nổ, gà con thành socola,</text>
    <text x="14" y="186" class="ts">ăn socola hồi 200 máu · hồi 6s</text>
  </g>
</svg>
