<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213a"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="than" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5266"/><stop offset="1" stop-color="#2a3041"/></linearGradient>
    <style>
      .t { fill: #fff; font-weight: 800; font-size: 30px; }
      .k { fill: #ffd166; font-weight: 800; font-size: 26px; }
      .m { fill: #d5dcf0; font-size: 19px; }
      .ln { stroke: #ffd166; stroke-width: 3; fill: none; }
      .dot { fill: #ffd166; }
      .btn { fill: #1b2030; stroke: #8a93aa; stroke-width: 2; }
      .on { stroke: #ffd166; stroke-width: 4; }
      .tt { font-weight: 800; font-size: 26px; }
      .ts { fill: #d5dcf0; font-size: 18px; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#nen)"/>
  <text x="600" y="48" text-anchor="middle" class="t" style="font-size:34px">🎮 Cách chơi bằng tay cầm</text>

  <!-- Thân tay cầm -->
  <path d="M440 170 H760 Q830 170 850 250 L880 360 Q895 430 840 430 Q800 430 780 385 L765 360 H435 L420 385 Q400 430 360 430 Q305 430 320 360 L350 250 Q370 170 440 170 Z" fill="url(#than)" stroke="#8a93aa" stroke-width="3"/>
  <rect x="430" y="132" width="100" height="32" rx="12" class="btn" opacity=".5"/>
  <rect x="670" y="132" width="100" height="32" rx="12" class="btn" opacity=".5"/>
  <rect x="555" y="195" width="90" height="56" rx="10" class="btn" opacity=".6"/>
  <rect x="520" y="202" width="12" height="20" rx="5" class="btn" opacity=".6"/>
  <rect x="668" y="202" width="12" height="20" rx="5" class="btn"/>

  <!-- Chữ thập (chạy) -->
  <path d="M458 220 h24 v18 h18 v24 h-18 v18 h-24 v-18 h-18 v-24 h18 z" class="btn on" transform="translate(-6 -2)"/>
  <!-- Nút △ □ ○ ✕ -->
  <circle cx="730" cy="206" r="20" class="btn on"/><text x="730" y="215" text-anchor="middle" fill="#6fe0c5" font-size="26" font-weight="800">△</text>
  <circle cx="696" cy="240" r="20" class="btn on"/><text x="696" y="249" text-anchor="middle" fill="#f48fb1" font-size="26" font-weight="800">□</text>
  <circle cx="764" cy="240" r="20" class="btn on"/><text x="764" y="249" text-anchor="middle" fill="#ff6b6b" font-size="26" font-weight="800">○</text>
  <circle cx="730" cy="274" r="20" class="btn on"/><text x="730" y="283" text-anchor="middle" fill="#7aa7ff" font-size="28" font-weight="800">✕</text>
  <!-- Cần analog -->
  <circle cx="530" cy="322" r="34" class="btn on"/><circle cx="530" cy="322" r="19" fill="#2b3145" stroke="#8a93aa" stroke-width="2"/>
  <circle cx="670" cy="322" r="34" class="btn on"/><circle cx="670" cy="322" r="19" fill="#2b3145" stroke="#8a93aa" stroke-width="2"/>

  <!-- Chú thích trái -->
  <path class="ln" d="M452 245 H320"/><circle class="dot" cx="452" cy="245" r="5"/>
  <text x="310" y="240" text-anchor="end" class="k">Mũi tên</text><text x="310" y="266" text-anchor="end" class="m">Chạy</text>

  <path class="ln" d="M498 332 H320"/><circle class="dot" cx="498" cy="332" r="5"/>
  <text x="310" y="327" text-anchor="end" class="k">Cần trái</text><text x="310" y="353" text-anchor="end" class="m">Bay</text>

  <!-- Chú thích phải -->
  <path class="ln" d="M750 197 H860"/><circle class="dot" cx="750" cy="197" r="5"/>
  <text x="872" y="204" class="k" style="fill:#6fe0c5">△</text><text x="912" y="204" class="m" style="font-size:22px">Chưởng</text>

  <path class="ln" d="M784 240 H860"/><circle class="dot" cx="784" cy="240" r="5"/>
  <text x="872" y="248" class="k" style="fill:#ff6b6b">○</text><text x="912" y="248" class="m" style="font-size:22px">Chiêu riêng</text>

  <path class="ln" d="M750 280 H860 V292 H860"/><circle class="dot" cx="750" cy="280" r="5"/>
  <text x="872" y="298" class="k" style="fill:#7aa7ff">✕</text><text x="912" y="298" class="m" style="font-size:22px">Đấm</text>

  <path class="ln" d="M702 332 H860"/><circle class="dot" cx="702" cy="332" r="5"/>
  <text x="872" y="336" class="k">Cần phải</text><text x="872" y="362" class="m">Chiêu riêng (đẩy đâu cũng được)</text>

  <path class="ln" d="M678 232 L650 190 V118"/><circle class="dot" cx="678" cy="232" r="5"/>
  <text x="650" y="102" text-anchor="middle" class="k" style="fill:#f48fb1">□ <tspan class="m" style="font-size:22px">Đá</tspan></text>
  <text x="600" y="414" text-anchor="middle" class="m" style="font-size:20px">Nút <tspan fill="#ffd166" font-weight="800">Options</tspan>: tạm dừng</text>

  <!-- Bảng chiêu -->
  <rect x="30" y="440" width="1140" height="300" rx="18" fill="#10172b" stroke="#2f3a5a" stroke-width="2"/>
  <text x="600" y="482" text-anchor="middle" class="t" style="font-size:26px">Bấm nút là ra chiêu, giữ nút để đánh liên tục</text>

  <g transform="translate(50 510)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#7aa7ff" stroke-width="3"/>
    <circle cx="130" cy="50" r="30" fill="#1b2030" stroke="#7aa7ff" stroke-width="3"/><text x="130" y="62" text-anchor="middle" fill="#7aa7ff" font-size="36" font-weight="800">✕</text>
    <text x="130" y="112" text-anchor="middle" class="tt" style="fill:#7aa7ff">ĐẤM</text>
    <text x="130" y="145" text-anchor="middle" class="ts">Đánh gà ở gần</text>
    <text x="130" y="172" text-anchor="middle" class="ts">Sát thương 50</text>
  </g>
  <g transform="translate(330 510)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#f48fb1" stroke-width="3"/>
    <circle cx="130" cy="50" r="30" fill="#1b2030" stroke="#f48fb1" stroke-width="3"/><text x="130" y="62" text-anchor="middle" fill="#f48fb1" font-size="36" font-weight="800">□</text>
    <text x="130" y="112" text-anchor="middle" class="tt" style="fill:#f48fb1">ĐÁ</text>
    <text x="130" y="145" text-anchor="middle" class="ts">Đòn mạnh hơn đấm</text>
    <text x="130" y="172" text-anchor="middle" class="ts">Mabu 70 · Zinbu 100</text>
  </g>
  <g transform="translate(610 510)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#6fe0c5" stroke-width="3"/>
    <circle cx="130" cy="50" r="30" fill="#1b2030" stroke="#6fe0c5" stroke-width="3"/><text x="130" y="61" text-anchor="middle" fill="#6fe0c5" font-size="34" font-weight="800">△</text>
    <text x="130" y="112" text-anchor="middle" class="tt" style="fill:#6fe0c5">CHƯỞNG</text>
    <text x="130" y="145" text-anchor="middle" class="ts">Bắn ra xa, làm cây đổ</text>
    <text x="130" y="172" text-anchor="middle" class="ts">Mabu 100 · Zinbu 150</text>
  </g>
  <g transform="translate(890 510)">
    <rect width="260" height="210" rx="14" fill="#1a2340" stroke="#ffd166" stroke-width="3"/>
    <circle cx="90" cy="50" r="30" fill="#1b2030" stroke="#ff6b6b" stroke-width="3"/><text x="90" y="61" text-anchor="middle" fill="#ff6b6b" font-size="34" font-weight="800">○</text>
    <circle cx="170" cy="50" r="30" fill="#2b3145" stroke="#ffd166" stroke-width="3"/><circle cx="170" cy="50" r="15" fill="#1b2030" stroke="#8a93aa" stroke-width="2"/>
    <text x="130" y="112" text-anchor="middle" class="tt" style="fill:#ffd166">CHIÊU RIÊNG</text>
    <text x="130" y="145" text-anchor="middle" class="ts" style="fill:#ec4899;font-weight:700">☁ Mabu: biến thành mây</text>
    <text x="130" y="172" text-anchor="middle" class="ts" style="fill:#facc15;font-weight:700">🍫 Zinbu: gà thành socola</text>
  </g>
</svg>
